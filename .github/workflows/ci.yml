name: CI

# This workflow does not launch DaVinci Resolve. The suite is contract, lint,
# packaging and host-free pytest; real-host validation (which needs a Resolve
# Studio licence for external scripting, or a GUI session for in-app scripts)
# is recorded separately under docs/validation/.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, "release-please--branches--**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.7"}
          - {os: windows-2022, python: "3.7"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: windows-latest, python: "3.9"}
          - {os: macos-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    env:
      DCC_MCP_DISABLE_DEFAULT_SKILL_PATHS: "1"
      DCC_MCP_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Require native core (py37-lite is insufficient)
        run: python -c "from dcc_mcp_core import DccServerBase; from dcc_mcp_core import _core; print(_core.__file__)"
      - name: Doctor contract smoke
        run: python -m pytest tests/test_doctor.py -q
      - run: python -m pytest -q

  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DCC_MCP_DISABLE_DEFAULT_SKILL_PATHS: "1"
      DCC_MCP_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel entry-point smoke
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/dcc-mcp-resolve --version
          wheel-smoke/bin/dcc-mcp-resolve doctor
